<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO - Home Gadgets Made Simple</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f7f5f0;color:#111}
header{background:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 1px 10px rgba(0,0,0,.06)}
.logo{font-size:28px;font-weight:900;letter-spacing:2px}
nav a{margin:0 10px;text-decoration:none;color:#111;font-size:14px}
.cart-btn{background:#111;color:#fff;border:0;padding:10px 16px;border-radius:20px;cursor:pointer}
.hero{text-align:center;padding:40px 16px;background:#eef0f2}
.hero h1{font-size:32px;margin-bottom:8px}
.hero p{color:#555;margin-bottom:16px}
.hero button{background:#111;color:#fff;border:0;padding:12px 24px;border-radius:6px;cursor:pointer}
.search{max-width:600px;margin:18px auto 0;display:flex;gap:8px}
.search input{flex:1;padding:12px;border:1px solid #ddd;border-radius:8px}
.search button{padding:12px 18px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer}
.grid{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:14px}
.card-body h3{font-size:16px}
.price{font-weight:800;margin:8px 0}
.tag{font-size:12px;color:#666}
.buy{width:100%;background:#111;color:#fff;border:0;padding:11px;border-radius:8px;cursor:pointer;margin-top:8px}
footer{text-align:center;padding:20px;font-size:13px;color:#666}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99}
.modal.open{display:flex}
.box{background:#fff;width:92%;max-width:520px;border-radius:14px;padding:20px;max-height:90vh;overflow:auto}
.box input,.box select,.box textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.box button{width:100%;padding:12px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer;margin-top:8px}
.close{float:right;cursor:pointer;font-size:20px}
.admin-link{text-align:center;margin:20px}
.admin-link a{color:#888;font-size:13px;cursor:pointer}
.small{font-size:12px;color:#888}
.badge{background:#e6ffe6;padding:4px 8px;border-radius:20px;font-size:12px}
@media(max-width:600px){.hero h1{font-size:24px}nav{display:none}}
</style>
</head>
<body>

<header>
  <div class="logo">ZERO</div>
  <nav><a href="#">Home</a><a href="#products">Shop</a><a href="#">About</a><a href="#">Contact</a></nav>
  <button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<div class="hero">
  <h1>HOME GADGETS MADE SIMPLE</h1>
  <p>Quality gadgets delivered to your door — Fast. Reliable. COD Available.</p>
  <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now</button>
  <div class="search">
    <input id="searchInput" placeholder="Search gadgets... e.g. Fan, Light" oninput="render()">
    <button onclick="render()">🔍</button>
  </div>
  <p class="small" style="margin-top:10px">FREE SHIPPING OVER ₱1000 • COD NATIONWIDE • 7-DAY RETURNS</p
